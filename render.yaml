services:
  - type: web
    name: tumaini-backend
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tumaini-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TUMAINI_DATABASE_URL
        value: sqlite:////var/data/tumaini_school.db
      - key: TUMAINI_FRONTEND_URL
        value: https://tumaini-frontend.onrender.com
      - key: TUMAINI_SMS_PROVIDER
        value: console
      - key: TUMAINI_SMS_SENDER_ID
        value: Tumaini

  - type: web
    name: tumaini-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tumaini-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
