services:
  - type: web
    name: tumaini-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TUMAINI_DATABASE_URL
        fromDatabase:
          name: tumaini-db
          property: connectionString
      - key: TUMAINI_FRONTEND_URL
        value: https://tumaini-frontend.onrender.com
      - key: TUMAINI_SMS_PROVIDER
        value: console
      - key: TUMAINI_SMS_SENDER_ID
        value: Tumaini

  - type: web
    name: tumaini-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tumaini-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: tumaini-db
    plan: free
    region: frankfurt
